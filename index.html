<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>График чтения Библии</title>
<link rel="icon" type="image/png" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5c3d24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Библия">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="modals.css">
</head>
<body>

<header>
  <div class="sync-status" id="syncStatusPill" data-state="off">
    <span class="sync-dot"></span>
    <span id="syncStatusText">Синхронизация выкл.</span>
  </div>

  <div class="mood-status" id="moodStatusPill" style="display:none;">😀</div>

  <h1>ГРАФИК ЧТЕНИЯ БИБЛИИ</h1>
  <p class="quote" id="dailyQuote">«Счастлив тот, кто… находит радость в законе Иеговы и читает его вполголоса день и ночь» (Псалом 1:1, 2).</p>
  <div class="overall-progress-wrap">
    <div class="xp-bar">
      <div class="xp-fill" id="overallFill"></div>
      <div class="xp-text" id="overallText">0 из 1189 глав (0%)</div>
    </div>
  </div>

  <div class="hour-bar-wrap" id="hourMonthWrap">
    <div class="hour-bar" id="hourMonthBar">
      <div class="hour-bar-light-fill" id="hourMonthLightFill"></div>
      <div class="hour-bar-dark-fill" id="hourMonthDarkFill"></div>
      <div class="hour-bar-zone-text" id="hourMonthAchievedText"></div>
      <div class="hour-bar-zone-text" id="hourMonthRemainingText"></div>
    </div>
    <div class="hour-input-overlay" id="hourMonthOverlay">
      <div class="hour-input-row">
        <input type="text" class="hour-input-mask" id="hourMonthInput" inputmode="numeric" placeholder="__.__" maxlength="6">
        <button class="hour-input-confirm" id="hourMonthConfirm" title="Подтвердить">&#10003;</button>
        <button class="hour-input-cancel" id="hourMonthCancel" title="Отмена">&times;</button>
        <button class="hour-input-info" id="hourMonthInfo" title="Статистика за месяц">i</button>
      </div>
      <textarea class="hour-input-note" id="hourMonthNoteInput" placeholder="Комментарий за сегодня…" rows="2" style="display:none;"></textarea>
    </div>
    <button class="hour-reset-btn" id="hourMonthResetBtn" style="display:none;">Сбросить счётчик</button>
  </div>

  <div class="hour-bar-wrap" id="hourYearWrap">
    <div class="hour-bar hour-year-bar" id="hourYearBar">
      <div class="hour-year-collapsed" id="hourYearCollapsed">
        <div class="hour-bar-light-fill" id="hourYearLightFill"></div>
        <div class="hour-bar-dark-fill" id="hourYearDarkFill"></div>
        <div class="hour-bar-zone-text" id="hourYearAchievedText"></div>
        <div class="hour-bar-zone-text" id="hourYearRemainingText"></div>
      </div>
      <div class="hour-year-segments" id="hourYearSegments"></div>
    </div>
  </div>

  <div class="goals-list-inline" id="goalsListInline"></div>

  <div class="missed-wrap" id="missedWrap">
    <div class="xp-bar">
      <div class="warn-fill"></div>
      <div class="warn-text" id="missedText"></div>
    </div>
  </div>

  <div class="update-wrap" id="updateWrap">
    <div class="xp-bar" id="updateBar">
      <div class="update-fill"></div>
      <div class="update-text" id="updateText">Доступна новая версия этого графика</div>
    </div>
  </div>

  <div class="goals-band" id="goalsBand">
    <div class="goals-list" id="goalsList"></div>
  </div>
  <div class="goals-toggle-wrap" id="goalsToggleWrap">
    <button class="goals-toggle-btn" id="goalsToggleBtn" title="Свернуть/развернуть личные цели">&#9660;</button>
  </div>
</header>

<main id="booksContainer"></main>

<footer>
  <div class="theme-picker">
    <div class="theme-picker-label">Тема оформления</div>
    <div class="theme-dots" id="themeDots"></div>
  </div>

  <div class="app-version" id="appVersionText">v0.18.0</div>
</footer>

<!-- ===== плавающая кнопка настроек — угловой язычок ===== -->
<!-- Раньше была отдельной круглой кнопкой с иконкой шестерёнки. Теперь —
     чистый (без пиктограммы) язычок, визуально как бы образованный стыком
     двух рядов язычков модалки настроек: бокового вертикального
     (#settingsTabs, приклеен к правому краю) и нижнего горизонтального
     (.settings-tabs-gear, приклеен к нижнему краю) — поэтому сам стоит
     вплотную к правому И нижнему краю экрана (см. .settings-fab в
     modals.css), а закруглён только один, "свободный" угол — верхний
     левый, — как и у обычных язычков закруглён только не прилегающий к
     окну край. Полупрозрачный, пока не наведён/не нажат. -->
<button class="settings-fab" id="settingsGearBtn" title="Настройки"></button>

<!-- ===== модальное окно настроек (шестерёнка) ===== -->
<div class="settings-modal-overlay" id="settingsModalOverlay">
  <div class="settings-modal-frame">
    <div class="settings-modal-box" id="settingsModalBox">
      <div class="settings-tab-content" id="settingsTabContent"></div>
      <button type="button" class="task-add-fab" id="taskAddFab" title="Добавить задачу">+</button>
    </div>
    <!-- Стек вкладок настроек. Благодаря flex-direction:column-reverse в CSS
         (.settings-tabs) первый элемент в DOM оказывается самым НИЖНИМ, а
         последний — самым ВЕРХНИМ. Порядок снизу вверх: red, inbox, next,
         projects, waiting, council, read, someday, archive — видны только
         если в настройках включена галочка "Показать все мои задачи"
         (см. refreshSettingsTabsVisibility в my.js). Вкладка настроек
         (шестерёнка) в этом стеке не участвует — она вынесена отдельным
         "лежачим" язычком под левый нижний угол окна, туда же, рядом с
         ней, теперь переехала и вкладка "Карта дней года" (см.
         .settings-tabs-gear ниже). Вкладка "Версии" и вкладка "Настроение"
         перенесены внутрь вкладки настроек как кнопки (см.
         renderSettingsTabGear в my.js). -->
    <div class="settings-tabs" id="settingsTabs">
      <!-- Пиктограмма — сплошной красный кружок (не значок-флажок, как
           раньше): цвет взят из цветной отметки приоритета задач,
           см. .task-flag-dot.flag-red в modals.css (#e0392b/#a52a1e) —
           тот же, достаточно яркий, а не тёмный оттенок красного. Красится
           жёстко fill/stroke, а не через currentColor, поэтому не
           перекрашивается вместе с фоном вкладки при .active. -->
      <button class="settings-tab task-tab" id="settingsTabRedBtn" data-task="red" title="red" style="display:none;">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" fill="#e0392b" stroke="#a52a1e" stroke-width="1.5"></circle>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabInboxBtn" data-task="inbox" title="inbox" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h4l2 3h4l2-3h4"></path>
          <path d="M4 12l1.5-7h13L20 12"></path>
          <path d="M4 12v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabNextBtn" data-task="next" title="next" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabProjectsBtn" data-task="projects" title="projects" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6z"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabWaitingBtn" data-task="waiting" title="waiting" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12"></path>
          <path d="M6 21h12"></path>
          <path d="M7 3c0 4 3 5 5 6-2 1-5 2-5 6"></path>
          <path d="M17 3c0 4-3 5-5 6 2 1 5 2 5 6"></path>
        </svg>
      </button>
      <!-- Новая вкладка-список задач "council" — устроена и оформлена
           точно как next (кнопка "+", добавление/редактирование задач,
           разделители, отступы — вся отрисовка идёт через тот же общий
           renderTaskTabList, см. TASK_TAB_IDS в my.js). Название нарочно
           нигде не выводится текстом (title пустой, как у вкладок-
           заглушек settingsTabExtra*) — только простая пиктограмма
           человечка. -->
      <button class="settings-tab task-tab" id="settingsTabCouncilBtn" data-task="council" title="" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7.5" r="3"></circle>
          <path d="M5 21c0-4 3-7 7-7s7 3 7 7"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabReadBtn" data-task="read" title="read" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6c-1.5-1.2-3.5-1.8-6-1.8v13.6c2.5 0 4.5.6 6 1.8"></path>
          <path d="M12 6c1.5-1.2 3.5-1.8 6-1.8v13.6c-2.5 0-4.5.6-6 1.8"></path>
          <path d="M12 6v13.6"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabSomedayBtn" data-task="someday" title="someday" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4l1.8 4.6 4.9.4-3.7 3.3 1.1 4.8L12 14.8 7.9 17.1l1.1-4.8-3.7-3.3 4.9-.4z"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabArchiveBtn" data-task="archive" title="archive" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="4" rx="1"></rect>
          <path d="M5 8v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path>
          <path d="M10 13h4"></path>
        </svg>
      </button>
    </div>
    <!-- Горизонтальный ряд "лежачих" вкладок под окном настроек, развёрнутых
         на 90° относительно обычных: у них ширина и высота поменяны местами
         (было 62×84 у вертикальной, стало 84×62 у лежачей), а закруглены не
         правый, а нижние углы, т.к. они "смотрят вниз" и приклеены
         снизу-слева к окну (см. .settings-tabs-gear в modals.css). Первая —
         вкладка настроек (шестерёнка), она же первая с левого края, по
         умолчанию активна и открывается при открытии окна настроек.
         Пиктограмма на ней — та же форма шестерёнки, что и была раньше
         (то же число зубьев — 7, та же их форма и размер: контур ниже —
         это тот же путь, что и в прежней закрашенной версии, просто
         пересчитан в масштаб 24×24 вместо 64×64), но теперь нарисована
         КОНТУРОМ (stroke), как и все остальные пиктограммы вкладок —
         fill="none", stroke="currentColor", та же толщина линии
         (stroke-width, stroke-linecap, stroke-linejoin), что и у них, а
         не сплошным силуэтом с вырезанной "дыркой" через fill-rule, как
         было раньше. Маленький кружок в центре — тоже контуром, обычным
         <circle>, а не вырезом. Красится через currentColor так же, как
         и другие пиктограммы: обычный цвет — var(--wood), при .active
         (см. .settings-tab.active в modals.css) — var(--parchment),
         никакого отдельного правила для этого не нужно. Сразу за ней —
         вкладка "Карта дней
         года" (settingsTabYearBtn, переехала сюда из вертикального стека
         #settingsTabs, чтобы быть рядом с шестерёнкой), затем 3 вкладки-
         заглушки (settingsTabExtra1..3, было 4 — одну убрали, освобождая
         место под вкладку года) — контент под них ещё не определён (см.
         renderSettingsTabExtra в my.js). Ширина каждой вкладки в этом
         ряду — переменная --settings-tab-size-h, которую JS считает от
         ширины окна настроек (а не от высоты, как --settings-tab-size у
         вертикального стека), т.к. в ряд помещается ровно 5 вкладок при
         текущей ширине окна (см. layoutSettingsModal в my.js). -->

          <circle cx="12" cy="12" r="2.25"></circle>
        </svg>
      </button>
      <button class="settings-tab settings-tab-gear" id="settingsTabYearBtn" title="Карта дней года">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="4" height="4" rx="1" fill="currentColor" opacity="0.25"></rect>
          <rect x="8" y="2" width="4" height="4" rx="1" fill="currentColor" opacity="0.9"></rect>

      <button class="settings-tab settings-tab-gear" id="settingsTabExtra1Btn" title=""></button>

      <button class="settings-tab settings-tab-gear" id="settingsTabExtra3Btn" title=""></button>

  </div>
