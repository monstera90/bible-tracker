<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>
window.addEventListener("error", function(e){
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:12px;font:12px monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;";
  box.textContent = "JS ERROR: " + e.message + "\n" + (e.filename||"") + ":" + e.lineno + ":" + e.colno + "\n" + (e.error && e.error.stack ? e.error.stack : "");
  document.body ? document.body.appendChild(box) : window.addEventListener("DOMContentLoaded", function(){ document.body.appendChild(box); });
});
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>График чтения Библии</title>
<link rel="icon" type="image/png" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8f7fb8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Библия">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="modals.css">
</head>
<body>

<header>
  <div class="sync-status" id="syncStatusPill" data-state="off">
    <span class="sync-dot"></span>
    <span id="syncStatusText">Настроить<br>синхронизацию</span>
  </div>

  <h1>ГРАФИК ЧТЕНИЯ БИБЛИИ</h1>
  <p class="quote" id="dailyQuote" style="display:none;"></p>
  <div class="overall-progress-wrap">
    <div class="xp-bar">
      <div class="xp-fill" id="overallFill"></div>
      <div class="xp-text" id="overallText">0 из 1189 глав (0%)</div>
    </div>
  </div>

  <div class="hour-bar-wrap" id="hourMonthWrap">
    <div class="hour-bar" id="hourMonthBar">
      <div class="hour-bar-light-fill" id="hourMonthLightFill"></div>
      <div class="hour-bar-dark-fill" id="hourMonthDarkFill"></div>
      <div class="hour-bar-zone-text" id="hourMonthAchievedText"></div>
      <div class="hour-bar-zone-text" id="hourMonthRemainingText"></div>
    </div>
    <div class="hour-input-overlay" id="hourMonthOverlay">
      <div class="hour-input-row">
        <input type="text" class="hour-input-mask" id="hourMonthInput" inputmode="numeric" placeholder="__.__" maxlength="6">
        <button class="hour-input-confirm" id="hourMonthConfirm" title="Подтвердить">&#10003;</button>
        <button class="hour-input-cancel" id="hourMonthCancel" title="Отмена">&times;</button>
        <button class="hour-input-info" id="hourMonthInfo" title="Статистика за месяц">i</button>
      </div>
      <textarea class="hour-input-note" id="hourMonthNoteInput" placeholder="Комментарий за сегодня…" rows="2" style="display:none;"></textarea>
    </div>
    <button class="hour-reset-btn" id="hourMonthResetBtn" style="display:none;">Сбросить счётчик</button>
  </div>

  <div class="hour-bar-wrap" id="hourYearWrap">
    <div class="hour-bar hour-year-bar" id="hourYearBar">
      <div class="hour-year-collapsed" id="hourYearCollapsed">
        <div class="hour-bar-light-fill" id="hourYearLightFill"></div>
        <div class="hour-bar-dark-fill" id="hourYearDarkFill"></div>
        <div class="hour-bar-zone-text" id="hourYearAchievedText"></div>
        <div class="hour-bar-zone-text" id="hourYearRemainingText"></div>
      </div>
      <div class="hour-year-segments" id="hourYearSegments"></div>
    </div>
  </div>

  <div class="goals-list-inline" id="goalsListInline"></div>

  <div class="missed-wrap" id="missedWrap">
    <div class="xp-bar">
      <div class="warn-fill"></div>
      <div class="warn-text" id="missedText"></div>
    </div>
  </div>

  <div class="update-wrap" id="updateWrap">
    <div class="xp-bar" id="updateBar">
      <div class="update-fill"></div>
      <div class="update-text" id="updateText">Доступна новая версия этого графика</div>
    </div>
  </div>

  <div class="goals-band" id="goalsBand">
    <div class="goals-list" id="goalsList"></div>
  </div>
  <div class="goals-toggle-wrap" id="goalsToggleWrap">
    <button class="goals-toggle-btn" id="goalsToggleBtn" title="Свернуть/развернуть личные цели">&#9660;</button>
  </div>
</header>

<main id="booksContainer"></main>

<footer>
  <div class="theme-picker">
    <div class="theme-dots" id="themeDots"></div>
  </div>

  <div class="footer-line">
    <div class="app-version" id="appVersionText">v0.18.0</div>
    <div class="fab-toggle" id="fabToggleBtn">Включить плавающую кнопку</div>
  </div>
</footer>

<!-- ===== плавающая кнопка настроек — угловой язычок ===== -->
<!-- Раньше была отдельной круглой кнопкой с иконкой шестерёнки. Теперь —
     чистый (без пиктограммы) язычок, визуально как бы образованный стыком
     двух рядов язычков модалки настроек: бокового вертикального
     (#settingsTabs, приклеен к правому краю) и нижнего горизонтального
     (.settings-tabs-gear, приклеен к нижнему краю) — поэтому сам стоит
     вплотную к правому И нижнему краю экрана (см. .settings-fab в
     modals.css), а закруглён только один, "свободный" угол — верхний
     левый, — как и у обычных язычков закруглён только не прилегающий к
     окну край. Полупрозрачный, пока не наведён/не нажат. -->
<button class="settings-fab" id="settingsGearBtn" title="Настройки"></button>

<!-- ===== модальное окно настроек (шестерёнка) ===== -->
<div class="settings-modal-overlay" id="settingsModalOverlay">
  <div class="settings-modal-frame">
    <div class="settings-modal-box" id="settingsModalBox">
      <div class="settings-tab-content" id="settingsTabContent"></div>
      <!-- "Ж" (форматирование выделения) и "Аа" (размер шрифта, общий с
           "Моим блокнотом") — слева от общей "+", в одном ряду с ней;
           видимость включается тем же условием, что и у .task-add-fab
           (см. switchSettingsTab в my.js), логика кнопок — в
           initTaskGlobalToolbar (my.js), см. ТЗ пользователя от 31.08. -->
      <span class="task-format-wrap" id="taskFormatWrap">
        <div class="mdeditor-fontsize-popup" id="taskFormatPopup">
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text fmt-btn-bold" id="taskFmtBoldBtn" title="Жирный">Ж</button>
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text fmt-btn-italic" id="taskFmtItalicBtn" title="Курсив">К</button>
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text fmt-btn-underline" id="taskFmtUnderlineBtn" title="Подчёркнутый">П</button>
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text fmt-btn-strike" id="taskFmtStrikeBtn" title="Зачёркнутый">Ч</button>
        </div>
        <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text fmt-btn-bold" id="taskFormatBtn" title="Форматирование выделенного текста">Ж</button>
      </span>
      <span class="task-fontsize-wrap" id="taskFontSizeWrap">
        <div class="mdeditor-fontsize-popup" id="taskFontSizePopup">
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text" id="taskFontPlusBtn" title="Крупнее">+</button>
          <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text" id="taskFontMinusBtn" title="Мельче">&minus;</button>
        </div>
        <button type="button" class="mdeditor-fab-btn mdeditor-fab-btn-text" id="taskFontSizeBtn" title="Размер шрифта">Аа</button>
      </span>
      <button type="button" class="task-add-fab" id="taskAddFab" title="Добавить задачу">+</button>
    </div>
    <!-- Стек вкладок настроек. Благодаря flex-direction:column-reverse в CSS
         (.settings-tabs) первый элемент в DOM оказывается самым НИЖНИМ, а
         последний — самым ВЕРХНИМ. Порядок снизу вверх: red, inbox, next,
         projects, waiting, council, read, someday, archive — видны только
         если в настройках включена галочка "Показать все мои задачи"
         (см. refreshSettingsTabsVisibility в my.js). Вкладка настроек
         (шестерёнка) в этом стеке не участвует — она вынесена отдельным
         "лежачим" язычком под левый нижний угол окна, туда же, рядом с
         ней, теперь переехала и вкладка "Карта дней года" (см.
         .settings-tabs-gear ниже). Вкладка "Версии" и вкладка "Настроение"
         перенесены внутрь вкладки настроек как кнопки (см.
         renderSettingsTabGear в my.js). -->
    <div class="settings-tabs" id="settingsTabs">
      <!-- Пиктограмма — сплошной красный кружок (не значок-флажок, как
           раньше): цвет взят из цветной отметки приоритета задач,
           см. .task-flag-dot.flag-red в modals.css (#e0392b/#a52a1e) —
           тот же, достаточно яркий, а не тёмный оттенок красного. Красится
           жёстко fill/stroke, а не через currentColor, поэтому не
           перекрашивается вместе с фоном вкладки при .active. -->
      <button class="settings-tab task-tab" id="settingsTabRedBtn" data-task="red" title="red" style="display:none;">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" fill="#e0392b" stroke="#a52a1e" stroke-width="0.75"></circle>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabInboxBtn" data-task="inbox" title="inbox" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h4l2 3h4l2-3h4"></path>
          <path d="M4 12l1.5-7h13L20 12"></path>
          <path d="M4 12v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabNextBtn" data-task="next" title="next" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabProjectsBtn" data-task="projects" title="projects" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6z"></path>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabWaitingBtn" data-task="waiting" title="waiting" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12"></path>
          <path d="M6 21h12"></path>
          <path d="M7 3c0 4 3 5 5 6-2 1-5 2-5 6"></path>
          <path d="M17 3c0 4-3 5-5 6 2 1 5 2 5 6"></path>
        </svg>
      </button>
      <!-- Новая вкладка-список задач "council" — устроена и оформлена
           точно как next (кнопка "+", добавление/редактирование задач,
           разделители, отступы — вся отрисовка идёт через тот же общий
           renderTaskTabList, см. TASK_TAB_IDS в my.js). Название нарочно
           нигде не выводится текстом (title пустой, как у вкладок-
           заглушек settingsTabExtra*) — только простая пиктограмма
           человечка. -->
      <button class="settings-tab task-tab" id="settingsTabCouncilBtn" data-task="council" title="" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7.5" r="3"></circle>
          <path d="M5 21c0-4 3-7 7-7s7 3 7 7"></path>
        </svg>
      </button>
      <!-- Раскрытая книга: раньше корешок и створки были заметно вытянуты
           по высоте (13.6 в высоту при развороте всего 12 в ширину, да
           ещё и слабый изгиб делал страницы визуально узкими "лепестками",
           а не разворотом книги). Здесь тот же принцип построения (одна
           кривая на каждую половину + прямой корешок), но пропорции
           перебалансированы: разворот шире (14 вместо 12), а высота
           меньше (11.3 вместо 15.4) — книга выглядит раскрытой, а не
           вытянутой в столбик. Толщина линии и итоговый размер
           пиктограммы не завязаны на конкретные цифры пути — берутся
           из общих правил #settingsTabs .task-tab svg (modals.css),
           как и у остальных вкладок бокового стека. -->
      <button class="settings-tab task-tab" id="settingsTabReadBtn" data-task="read" title="read" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7c-1.8-1-4.5-1.3-7-1.3v10c2.5 0 4.7.3 7 1.3"></path>
          <path d="M12 7c1.8-1 4.5-1.3 7-1.3v10c-2.5 0-4.7.3-7 1.3"></path>
          <path d="M12 7v10"></path>
        </svg>
      </button>
      <!-- Пиктограмма — та же стрелочка, что и у Next (см. #settingsTabNextBtn
           выше), просто повёрнута на 90° против часовой стрелки (rotate(-90)
           вокруг центра 12,12), чтобы указывать вверх, а не вправо. -->
      <button class="settings-tab task-tab" id="settingsTabSomedayBtn" data-task="someday" title="someday" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <g transform="rotate(-90 12 12)">
            <path d="M5 12h13"></path>
            <path d="M13 6l6 6-6 6"></path>
          </g>
        </svg>
      </button>
      <button class="settings-tab task-tab" id="settingsTabArchiveBtn" data-task="archive" title="archive" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="4" rx="1"></rect>
          <path d="M5 8v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path>
          <path d="M10 13h4"></path>
        </svg>
      </button>
    </div>
    <!-- Горизонтальный ряд "лежачих" вкладок под окном настроек, развёрнутых
         на 90° относительно обычных: у них ширина и высота поменяны местами
         (было 62×84 у вертикальной, стало 84×62 у лежачей), а закруглены не
         правый, а нижние углы, т.к. они "смотрят вниз" и приклеены
         снизу-слева к окну (см. .settings-tabs-gear в modals.css). Первая —
         вкладка настроек (шестерёнка), она же первая с левого края, по
         умолчанию активна и открывается при открытии окна настроек.
         Пиктограмма на ней — та же форма шестерёнки, что и была раньше
         (то же число зубьев — 7, та же их форма и размер: контур ниже —
         это тот же путь, что и в прежней закрашенной версии, просто
         пересчитан в масштаб 24×24 вместо 64×64), но теперь нарисована
         КОНТУРОМ (stroke), как и все остальные пиктограммы вкладок —
         fill="none", stroke="currentColor", та же толщина линии
         (stroke-width, stroke-linecap, stroke-linejoin), что и у них, а
         не сплошным силуэтом с вырезанной "дыркой" через fill-rule, как
         было раньше. Маленький кружок в центре — тоже контуром, обычным
         <circle>, а не вырезом. Красится через currentColor так же, как
         и другие пиктограммы: обычный цвет — var(--wood), при .active
         (см. .settings-tab.active в modals.css) — var(--parchment),
         никакого отдельного правила для этого не нужно. Сразу за ней —
         вкладка "Карта дней
         года" (settingsTabYearBtn, переехала сюда из вертикального стека
         #settingsTabs, чтобы быть рядом с шестерёнкой), сразу за ней —
         вкладка диаграммы настроения (settingsTabMoodBtn, заняла место
         бывшей вкладки-заглушки settingsTabExtra1Btn; раньше диаграмма
         открывалась кнопкой "Показать диаграмму настроения" на вкладке
         настроек — эта кнопка убрана, диаграмма доступна только отсюда,
         см. renderSettingsTabMood в my.js), затем 2 вкладки-заглушки
         (settingsTabExtra2..3) — контент под них ещё не определён (см.
         renderSettingsTabExtra в my.js). Ширина каждой вкладки в этом
         ряду зафиксирована в CSS — 68px (см. .settings-tab-gear в
         modals.css), не зависит от ширины окна настроек и больше не
         считается JS-ом. -->
    <div class="settings-tabs-gear" id="settingsTabsGear">

    <!-- ===== ВТОРОЙ НАБОР ВКЛАДОК (заглушки) =====
         Полный дубль первого набора по устройству: 9 боковых язычков
         (.settings-tabs) + 5 нижних (.settings-tabs-gear) — те же CSS-
         классы, поэтому размер язычков (фиксированные 68px и у боковых,
         и у нижних, см. .settings-tab / .settings-tab-gear в modals.css)
         общий для обоих наборов. Стоят в той
         же точке (position:absolute от .settings-modal-frame), что и
         первый набор — видно всегда только ОДИН набор, второй скрыт через
         display:none (см. applySettingsTabSetVisibility в my.js).
         Каждая кнопка пока просто заглушка: клик по ней показывает текст
         "Вкладка пока не запрограммирована" (см. renderSettingsTabSet2Stub
         в my.js) — сама функция появится позже. Первая нижняя вкладка
         (settingsTabSet2GearBtn1) играет роль "домашней" для этого набора
         — так же, как шестерёнка для первого — и открывается по
         умолчанию при переключении на второй набор (см.
         cycleSettingsTabSet в my.js). Третья нижняя вкладка
         (settingsTabSet2GearBtn3) тоже уже не заглушка — это вкладка
         "Объединение заметок" (слияние .jwlibrary файлов), см.
         renderSettingsTabNotesMerge в jwlmerge.js и её отдельную ветку в
         switchSettingsTab в my.js (стоит ДО общей проверки на
         renderSettingsTabSet2Stub, иначе заглушка перехватила бы её тоже).
         Вторая нижняя вкладка (settingsTabSet2GearBtn2) тоже уже не
         заглушка — это вкладка "Заполнение бланков S-89": пользователь
         прикрепляет подложку-бланк (картинку) и .docx с графиком, для
         каждого подходящего задания рисуется отдельный заполненный бланк
         (Canvas API вместо Pillow из исходного python-скрипта) и все они
         скачиваются в Downloads — см. renderSettingsTabS89Fill в s89fill.js
         (плюс s89tasks.js — разбор документа, s89draw.js — сама отрисовка)
         и её отдельную ветку в switchSettingsTab (по той же причине, стоит
         ДО общей проверки на renderSettingsTabSet2Stub).
         Четвёртая нижняя вкладка (settingsTabSet2GearBtn4) тоже уже не
         заглушка — это вкладка "Извлечение субтитров": пользователь даёт
         видео (.mp4) со встроенной текстовой дорожкой субтитров (tx3g),
         текст читается прямо в браузере обычным разбором контейнера mp4
         (без сети, без ffmpeg/WebAssembly — см. extractSubtitleCuesFromMp4
         в my.js), см. renderSettingsTabSubtitleExtract в my.js и её
         отдельную ветку в switchSettingsTab (по той же причине, стоит ДО
         общей проверки на renderSettingsTabSet2Stub). Пятая боковая
         вкладка (settingsTabSet2Btn5) тоже уже не заглушка — это вкладка
         "Разделение epub-файлов": книга .epub конвертируется в текст (в
         правильном порядке чтения, по spine из content.opf) и делится на
         несколько .txt-частей для источников NotebookLM, см.
         renderSettingsTabEpubSplit в epubsplit.js и её отдельную ветку в
         switchSettingsTab (по той же причине, стоит ДО общей проверки на
         renderSettingsTabSet2Stub).
         Шестая боковая вкладка (settingsTabSet2Btn6) — ЭТО БОЛЬШЕ НЕ
         ЗАГЛУШКА: это вкладка "Изменение размера изображения". Пользователь
         прикрепляет .jpg/.png, задаёт нужные ширину и высоту в пикселях —
         картинка масштабируется на Canvas и скачивается уже нужного
         размера (например, чтобы сделать из иконки 512×512 иконку меньшего
         размера). Галочка "Сохранять пропорции" (по умолчанию включена)
         решает, что делать, если соотношение сторон исходника не совпадает
         с заданным: при включённой галочке картинка вписывается в рамку
         целиком без искажений (лишнее место остаётся пустым), при
         выключенной — надпись меняется на "Изображение будет обрезано" и
         кадр обрезается по центру, но не растягивается. См.
         renderSettingsTabImgResize в imgresize.js и её отдельную ветку в
         switchSettingsTab (по той же причине, стоит ДО общей проверки на
         renderSettingsTabSet2Stub). -->
