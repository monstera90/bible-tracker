name: Android APK

# Сборка подписанного APK. Запуск: вручную (Actions → Android APK → Run workflow) или тегом apk-v*.
# Коммит в main APK НЕ пересобирает (нативные изменения нужны редко).
# Результат: артефакт и GitHub Release (тег apk-v<версия>-b<номер запуска>, либо сам тег apk-v*).

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Проверить секреты подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты подписи (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). См. README_ANDROID.md, раздел 2."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовить веб-часть и иконку
        id: prep
        run: python3 tools/android_prepare.py

      - name: Убедиться, что в Android SDK есть нужные компоненты
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            set +o pipefail
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          else
            echo "sdkmanager не найден, надеемся на предустановленный SDK"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Декодировать keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Собрать release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle --no-daemon :app:assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.prep.outputs.version_name }}

      - name: Проверить подпись и подготовить файл
        id: apk
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$SRC" | tee "$RUNNER_TEMP/certs.txt"
          FP=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | sed 's/.*: //')
          NAME="LifeTracker-${{ steps.prep.outputs.version_name }}-b${{ github.run_number }}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Выгрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: LifeTracker-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Опубликовать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-v${{ steps.prep.outputs.version_name }}-b${{ github.run_number }}"
          fi
          NOTES="Веб-часть ${{ steps.prep.outputs.version }}, versionCode ${{ github.run_number }}. SHA-256 сертификата подписи: ${{ steps.apk.outputs.fingerprint }} (у всех сборок должен совпадать)."
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Life tracker APK ${{ steps.prep.outputs.version_name }} (сборка ${{ github.run_number }})" \
            --notes "$NOTES" \
            --latest=false
