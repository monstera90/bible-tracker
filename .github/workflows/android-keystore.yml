name: Android keystore (разово)

# Создаёт НОВЫЙ ключ подписи для APK. Запускается один раз, до первой сборки APK.
# Пароли и алиас берутся из секретов репозитория (их надо создать до запуска, см. README_ANDROID.md, раздел 2).
# Результат: артефакт keystore_base64.txt (1 день). Его содержимое вставляется в секрет KEYSTORE_BASE64,
# копия сохраняется ВНЕ GitHub, затем артефакт удаляется.
# Повторно НЕ запускать: новый ключ не позволит обновить приложение поверх установленного.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить секреты
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 уже существует. Ключ уже создан; повторный запуск создал бы другой ключ и сломал обновления поверх. Если ключ потерян, удалите секрет вручную и начните заново (приложение придётся поставить заново, локальные данные пропадут)."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Нужно сначала создать секреты KEYSTORE_PASSWORD, KEY_ALIAS и KEY_PASSWORD (README_ANDROID.md, раздел 2)."
            exit 1
          fi
          if [ "$KEYSTORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD и KEY_PASSWORD должны быть одинаковыми (формат PKCS12)."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 20 ]; then
            echo "::error::Пароль короче 20 символов. Артефакт этого запуска доступен для скачивания всем, у кого есть аккаунт GitHub (репозиторий публичный), поэтому защитой служит только длинный случайный пароль."
            exit 1
          fi

      - name: Создать keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -keystore lifetracker.p12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=Life tracker, O=Life tracker, C=RU" > /dev/null 2>&1
          base64 -w0 lifetracker.p12 > keystore_base64.txt
          rm lifetracker.p12
          echo "keystore создан, размер base64: $(wc -c < keystore_base64.txt) байт"

      - name: Выгрузить артефакт (1 день)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-УДАЛИТЬ-ПОСЛЕ-СКАЧИВАНИЯ
          path: keystore_base64.txt
          retention-days: 1
