<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Диагностика Life tracker</title>
<style>
  body{font:14px/1.4 system-ui,sans-serif;margin:0;padding:12px;background:#f4f0f8;color:#222}
  h1{font-size:18px;margin:0 0 8px}
  button,a.btn{display:inline-block;font:inherit;padding:10px 14px;margin:4px 6px 4px 0;border:0;border-radius:8px;background:#8f7fb8;color:#fff;text-decoration:none}
  pre{white-space:pre-wrap;word-break:break-word;background:#fff;border-radius:8px;padding:10px;margin:8px 0;font:12px/1.45 monospace;user-select:text}
  .hint{color:#555;font-size:12px}
</style>
</head>
<body>
<h1>Диагностика Life tracker</h1>
<div class="hint">Служебная страница оболочки. Данные приложения не меняет: пробные записи удаляются сразу.</div>
<div>
  <button id="run">Запустить проверки</button>
  <button id="cam">Проверить камеру</button>
  <button id="upd">Состояние обновления</button>
  <button id="updcheck">Проверить обновление</button>
  <button id="updtest">Самотест обновления</button>
  <button id="s4bridge">Шаг 4: мост</button>
  <button id="s4save">Шаг 4: сохранить файл</button>
  <button id="s4share">Шаг 4: поделиться</button>
  <button id="s4full">Шаг 4: полный экран</button>
  <button id="copy">Копировать результат</button>
  <a class="btn" href="/index.html">В приложение</a>
</div>
<pre id="out">Нажмите «Запустить проверки».</pre>
<!-- Тот же файл, что в приложении: проверяем настоящий код подмены скачивания и navigator.share. -->
<script src="/native-shell.js"></script>
<script>
(function(){
  var FIREBASE = "https://my-nekogram-default-rtdb.europe-west1.firebasedatabase.app";
  var lines = [];
  var out = document.getElementById("out");
  function show(){ out.textContent = lines.join("\n"); }
  function add(ok, name, detail){
    lines.push((ok === null ? "ℹ️" : ok ? "✅" : "❌") + " " + name + (detail ? " — " + detail : ""));
    show();
  }
  function fmtErr(e){ return (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e)); }

  function idbTest(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("__lt_diag", 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore("s"); };
      req.onerror = function(){ reject(req.error); };
      req.onsuccess = function(){
        var db = req.result;
        var tx = db.transaction("s", "readwrite");
        tx.objectStore("s").put({n: 42, t: "привет"}, "k");
        tx.oncomplete = function(){
          var r = db.transaction("s").objectStore("s").get("k");
          r.onsuccess = function(){
            var v = r.result;
            db.close();
            var del = indexedDB.deleteDatabase("__lt_diag");
            del.onsuccess = function(){ resolve(v && v.n === 42 && v.t === "привет"); };
            del.onerror = function(){ resolve(false); };
            del.onblocked = function(){ resolve(false); };
          };
          r.onerror = function(){ db.close(); reject(r.error); };
        };
        tx.onerror = function(){ db.close(); reject(tx.error); };
      };
    });
  }

  async function opfsTest(){
    var root = await navigator.storage.getDirectory();
    var fh = await root.getFileHandle("__lt_diag.txt", {create: true});
    var features = "createWritable=" + (typeof fh.createWritable) + ", createSyncAccessHandle=" + (typeof fh.createSyncAccessHandle);
    if(typeof fh.createWritable !== "function") throw new Error("нет createWritable (" + features + ")");
    var w = await fh.createWritable();
    await w.write("привет");
    await w.close();
    var text = await (await fh.getFile()).text();
    await root.removeEntry("__lt_diag.txt");
    if(text !== "привет") throw new Error("прочитано «" + text + "»");
    return features;
  }

  async function probe(label, url, opts, note){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 12000);
    try{
      var o = opts || {};
      o.signal = ctl.signal;
      var res = await fetch(url, o);
      add(true, label, "HTTP " + res.status + " (ответ получен, CORS пропускает)" + (note ? ". " + note : ""));
    }catch(e){
      add(false, label, "ошибка: " + fmtErr(e) + " (CORS или нет сети)" + (note ? ". " + note : ""));
    }finally{
      clearTimeout(timer);
    }
  }

  async function runAll(){
    lines = [];
    add(null, "Адрес страницы", location.origin + " (secure context: " + window.isSecureContext + ")");
    add(null, "WebView", navigator.userAgent);
    try{
      if(window.LifeTrackerNative){ add(true, "Мост LifeTrackerNative", LifeTrackerNative.getAppInfo()); }
      else add(false, "Мост LifeTrackerNative", "объекта нет");
    }catch(e){ add(false, "Мост LifeTrackerNative", fmtErr(e)); }

    add(null, "Экран", "innerWidth=" + innerWidth + ", innerHeight=" + innerHeight + ", dpr=" + devicePixelRatio +
      (window.visualViewport ? ", visualViewport=" + Math.round(visualViewport.width) + "x" + Math.round(visualViewport.height) : ""));
    try{
      var probeEl = document.createElement("div");
      probeEl.style.cssText = "position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
      document.body.appendChild(probeEl);
      var cs = getComputedStyle(probeEl);
      add(null, "env(safe-area-inset) top/right/bottom/left", [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(" / "));
      probeEl.remove();
    }catch(e){}

    add(!!(window.crypto && crypto.subtle), "crypto.subtle (шифрование заметок и файлов)");
    try{ localStorage.setItem("__lt_diag", "1"); var v = localStorage.getItem("__lt_diag"); localStorage.removeItem("__lt_diag"); add(v === "1", "localStorage"); }
    catch(e){ add(false, "localStorage", fmtErr(e)); }
    try{ add(await idbTest(), "IndexedDB (запись, чтение, удаление)"); }
    catch(e){ add(false, "IndexedDB", fmtErr(e)); }
    try{ add(true, "OPFS (navigator.storage.getDirectory)", await opfsTest()); }
    catch(e){ add(false, "OPFS (navigator.storage.getDirectory)", fmtErr(e)); }
    try{
      var c = await caches.open("__lt_diag");
      await c.put("/__lt_diag", new Response("ok"));
      var m = await c.match("/__lt_diag");
      var ok = !!m && (await m.text()) === "ok";
      await caches.delete("__lt_diag");
      add(ok, "Cache API");
    }catch(e){ add(false, "Cache API", fmtErr(e)); }
    try{
      var est = await navigator.storage.estimate();
      var pers = navigator.storage.persisted ? await navigator.storage.persisted() : "нет API";
      add(null, "Хранилище", "квота ≈ " + Math.round(est.quota / 1048576) + " МБ, занято ≈ " + Math.round(est.usage / 1048576) + " МБ, persisted=" + pers);
    }catch(e){ add(null, "Хранилище", fmtErr(e)); }
    add(null, "Service worker в WebView", ("serviceWorker" in navigator) ? "API есть (приложение его в оболочке не регистрирует)" : "API нет");

    try{
      var res = await fetch("/vendor/sql-wasm.wasm");
      var ct = res.headers.get("content-type");
      var buf = await res.arrayBuffer();
      var mod = await WebAssembly.compile(buf);
      add(res.ok && ct === "application/wasm", "sql-wasm.wasm из бандла", "HTTP " + res.status + ", " + ct + ", " + Math.round(buf.byteLength / 1024) + " КБ, компиляция ок, instantiateStreaming=" + (typeof WebAssembly.instantiateStreaming));
    }catch(e){ add(false, "sql-wasm.wasm из бандла", fmtErr(e)); }
    try{
      var v2 = await (await fetch("/version.json", {cache: "no-store"})).json();
      add(!!v2.version, "version.json бандла", JSON.stringify(v2));
    }catch(e){ add(false, "version.json бандла", fmtErr(e)); }

    updState();

    await probe("Firebase: GET (облачная синхронизация)", FIREBASE + "/syncs/__lt_diag_probe.json?shallow=true", {},
      "200 или 401/403 — нормально: главное, что ответ дошёл");
    await probe("Firebase: PATCH с JSON (проверка preflight)", FIREBASE + "/syncs/__lt_diag_probe.json", {
      method: "PATCH", headers: {"Content-Type": "application/json"}, body: "{}"
    }, "тело {} ничего не создаёт");
    await probe("YouTube oEmbed (заголовки видео)", "https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=dQw4w9WgXcQ"));
    await probe("corsproxy.io (прокси для flibusta)", "https://corsproxy.io/?url=" + encodeURIComponent("https://example.com/"),
      {}, "если здесь ошибка, а flibusta в приложении работает, это нормально");
    await probe("docs.google.com (s89 и workbooks)", "https://docs.google.com/document/d/1/export?format=txt", {},
      "только справка: реальные ссылки проверяются в самой функции");
    add(null, "Готово", new Date().toLocaleString());
  }

  async function camTest(){
    try{
      var stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
      var tracks = stream.getVideoTracks();
      var label = tracks.length ? tracks[0].label : "?";
      tracks.forEach(function(t){ t.stop(); });
      add(true, "Камера (getUserMedia)", label);
    }catch(e){ add(false, "Камера (getUserMedia)", fmtErr(e)); }
  }

  function updState(){
    try{
      if(!window.LifeTrackerNative || !LifeTrackerNative.getWebUpdateState){
        add(false, "Обновление веба", "в этой оболочке нет моста обновления (нужен APK шага 3)");
        return null;
      }
      var s = JSON.parse(LifeTrackerNative.getWebUpdateState());
      add(null, "Обновление веба", "встроенная " + s.builtin + ", раздаётся " + s.served + ", активная " + (s.active || "—") +
        ", запасная " + (s.lastGood || "—") + ", ждёт запуска " + (s.pending || "—") + ", пробная " + (s.trial || "—") +
        ", неудачные [" + (s.bad || []).join(", ") + "]. Последняя проверка: " + s.lastResult);
      return s;
    }catch(e){ add(false, "Обновление веба", fmtErr(e)); return null; }
  }

  function updCheck(){
    if(!window.LifeTrackerNative || !LifeTrackerNative.checkWebUpdateNow){ updState(); return; }
    LifeTrackerNative.checkWebUpdateNow();
    add(null, "Проверка обновления", "запущена, жду ответ GitHub");
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      var s = null;
      try{ s = JSON.parse(LifeTrackerNative.getWebUpdateState()); }catch(e){}
      if((s && !s.busy && tries > 1) || tries > 90){
        clearInterval(timer);
        updState();
      }
    }, 1000);
  }

  function updSelfTest(){
    try{
      var text = LifeTrackerNative.runWebUpdateSelfTest();
      text.split("\n").forEach(function(l){ if(l) lines.push(l); });
      show();
    }catch(e){ add(false, "Самотест обновления", fmtErr(e)); }
  }

  // ===== Шаг 4: нативные замены =====
  var S4_METHODS = ["beginSave", "appendSave", "finishSave", "cancelSave", "showToast", "beginStage", "finishStage",
    "shareStaged", "shareText", "clearStaged", "setFullscreen", "takeSharedFiles", "releaseSharedFile", "setStatusBarColor"];

  function s4Bridge(){
    var N = window.LifeTrackerNative;
    if(!N){ add(false, "Мост шага 4", "нет LifeTrackerNative"); return; }
    var info = {};
    try{ info = JSON.parse(N.getAppInfo()); }catch(e){}
    add(info.bridgeVersion >= 2, "Версия моста", String(info.bridgeVersion || "нет (APK старше шага 4)") + ", APK " + (info.versionName || "?"));
    var missing = S4_METHODS.filter(function(m){ return typeof N[m] === "undefined"; });
    add(missing.length === 0, "Методы моста шага 4", missing.length ? "нет: " + missing.join(", ") : "все " + S4_METHODS.length + " на месте");
    add(!!window.LifeTrackerShell, "native-shell.js загружен", window.LifeTrackerShell ? "да, сохранение: " + window.LifeTrackerShell.canSave() + ", поделиться: " + window.LifeTrackerShell.canShare() : "нет");
    add(typeof navigator.share === "function", "navigator.share определён", String(typeof navigator.share));
  }

  // Файл 5 МБ (два куска по 3 МБ): байты i % 251, чтобы размер и содержимое можно было сверить глазами по размеру файла.
  function s4Save(){
    s4Bridge();
    var size = 5 * 1024 * 1024;
    var bytes = new Uint8Array(size);
    for(var i = 0; i < size; i++) bytes[i] = i % 251;
    var blob = new Blob([bytes], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "lt-diag-test.bin";
    document.body.appendChild(a);
    var t0 = Date.now();
    document.addEventListener("lt-native-saved", function onSaved(ev){
      document.removeEventListener("lt-native-saved", onSaved);
      var d = ev.detail || {};
      add(d.bytes === size, "Сохранение через a.click()", "имя «" + d.name + "», " + d.bytes + " из " + size + " байт, " + (Date.now() - t0) + " мс. Проверьте файл в «Загрузках»: размер 5 242 880 байт");
    });
    a.click(); // подменённый click: файл уходит в оболочку, на экране появится сообщение «Сохранено в «Загрузки»»
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
    add(null, "Сохранение запущено", "жду ответ оболочки");
  }

  function s4Share(){
    var file;
    try{ file = new File(["Проверка «Поделиться» из Life tracker\n"], "lt-diag-share.txt", { type: "text/plain" }); }
    catch(e){ add(false, "Создание файла", fmtErr(e)); return; }
    var can = typeof navigator.canShare === "function" ? navigator.canShare({ files: [file] }) : "нет canShare";
    add(can === true, "canShare с файлом", String(can));
    if(typeof navigator.share !== "function"){ add(false, "Поделиться", "navigator.share нет"); return; }
    navigator.share({ files: [file], title: "Проверка" }).then(function(){
      add(true, "Поделиться", "системное меню открыто (выберите приложение и проверьте, что файл дошёл)");
    }, function(e){ add(false, "Поделиться", fmtErr(e)); });
  }

  function s4Full(){
    var N = window.LifeTrackerNative;
    if(!N || typeof N.setFullscreen === "undefined"){ add(false, "Полный экран", "нет setFullscreen (APK старше шага 4)"); return; }
    N.setFullscreen(true);
    add(null, "Полный экран", "включён на 5 секунд: строка состояния и системные кнопки должны исчезнуть, провести от края экрана — показать на время");
    setTimeout(function(){ N.setFullscreen(false); add(null, "Полный экран", "выключен: панели должны вернуться"); }, 5000);
  }

  document.getElementById("s4bridge").onclick = function(){ s4Bridge(); };
  document.getElementById("s4save").onclick = function(){ s4Save(); };
  document.getElementById("s4share").onclick = function(){ s4Share(); };
  document.getElementById("s4full").onclick = function(){ s4Full(); };

  document.getElementById("run").onclick = function(){ runAll(); };
  document.getElementById("upd").onclick = function(){ updState(); };
  document.getElementById("updcheck").onclick = function(){ updCheck(); };
  document.getElementById("updtest").onclick = function(){ updSelfTest(); };
  document.getElementById("cam").onclick = function(){ camTest(); };
  document.getElementById("copy").onclick = function(){
    var text = lines.join("\n");
    try{ navigator.clipboard.writeText(text).then(function(){ add(null, "Скопировано в буфер"); }, function(e){ add(false, "Копирование", fmtErr(e)); }); }
    catch(e){ add(false, "Копирование", fmtErr(e)); }
  };
})();
</script>
</body>
</html>
