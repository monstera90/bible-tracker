<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Диагностика Life tracker</title>
<style>
  body{font:14px/1.4 system-ui,sans-serif;margin:0;padding:12px;background:#f4f0f8;color:#222}
  h1{font-size:18px;margin:0 0 8px}
  button,a.btn{display:inline-block;font:inherit;padding:10px 14px;margin:4px 6px 4px 0;border:0;border-radius:8px;background:#8f7fb8;color:#fff;text-decoration:none}
  pre{white-space:pre-wrap;word-break:break-word;background:#fff;border-radius:8px;padding:10px;margin:8px 0;font:12px/1.45 monospace;user-select:text}
  .hint{color:#555;font-size:12px}
</style>
</head>
<body>
<h1>Диагностика Life tracker</h1>
<div class="hint">Служебная страница оболочки. Данные приложения не меняет: пробные записи удаляются сразу.</div>
<div>
  <button id="run">Запустить проверки</button>
  <button id="cam">Проверить камеру</button>
  <button id="upd">Состояние обновления</button>
  <button id="updcheck">Проверить обновление</button>
  <button id="updtest">Самотест обновления</button>
  <button id="s4bridge">Шаг 4: мост</button>
  <button id="s4save">Шаг 4: сохранить файл</button>
  <button id="s4share">Шаг 4: поделиться</button>
  <button id="s4full">Шаг 4: полный экран</button>
  <button id="s5state">Шаг 5: состояние</button>
  <button id="s5perm">Шаг 5: разрешение</button>
  <button id="s5test">Шаг 5: тест через 1 мин</button>
  <button id="s5poll">Шаг 5: проверить группу</button>
  <button id="s5bg">Шаг 5: работа в фоне</button>
  <button id="s6idb">Шаг 6: IndexedDB</button>
  <button id="s6check">Шаг 6: самопроверка экспорта</button>
  <button id="s6snap">Шаг 6: снимок данных</button>
  <button id="s6cmp">Шаг 6: сравнить снимки (2 файла, можно по одному)</button>
  <button id="s6arc">Шаг 6: проверить архив (1–2 файла)</button>
  <button id="s6arc2">Шаг 6: сверить два архива (по одному)</button>
  <button id="s6pick">Шаг 6: выбор файла</button>
  <button id="s6b100">Шаг 6: объём 100 МБ</button>
  <button id="s6b300">Шаг 6: объём 300 МБ</button>
  <button id="s6b600">Шаг 6: объём 600 МБ</button>
  <button id="copy">Копировать результат</button>
  <a class="btn" href="/index.html">В приложение</a>
</div>
<pre id="out">Нажмите «Запустить проверки».</pre>
<!-- Тот же файл, что в приложении: проверяем настоящий код подмены скачивания и navigator.share. -->
<script src="/native-shell.js"></script>
<script src="/minizip.js"></script>
<script>
(function(){
  var FIREBASE = "https://my-nekogram-default-rtdb.europe-west1.firebasedatabase.app";
  var lines = [];
  var out = document.getElementById("out");
  function show(){ out.textContent = lines.join("\n"); }
  function add(ok, name, detail){
    lines.push((ok === null ? "ℹ️" : ok ? "✅" : "❌") + " " + name + (detail ? " — " + detail : ""));
    show();
  }
  function fmtErr(e){ return (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e)); }

  function idbTest(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("__lt_diag", 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore("s"); };
      req.onerror = function(){ reject(req.error); };
      req.onsuccess = function(){
        var db = req.result;
        var tx = db.transaction("s", "readwrite");
        tx.objectStore("s").put({n: 42, t: "привет"}, "k");
        tx.oncomplete = function(){
          var r = db.transaction("s").objectStore("s").get("k");
          r.onsuccess = function(){
            var v = r.result;
            db.close();
            var del = indexedDB.deleteDatabase("__lt_diag");
            del.onsuccess = function(){ resolve(v && v.n === 42 && v.t === "привет"); };
            del.onerror = function(){ resolve(false); };
            del.onblocked = function(){ resolve(false); };
          };
          r.onerror = function(){ db.close(); reject(r.error); };
        };
        tx.onerror = function(){ db.close(); reject(tx.error); };
      };
    });
  }

  async function opfsTest(){
    var root = await navigator.storage.getDirectory();
    var fh = await root.getFileHandle("__lt_diag.txt", {create: true});
    var features = "createWritable=" + (typeof fh.createWritable) + ", createSyncAccessHandle=" + (typeof fh.createSyncAccessHandle);
    if(typeof fh.createWritable !== "function") throw new Error("нет createWritable (" + features + ")");
    var w = await fh.createWritable();
    await w.write("привет");
    await w.close();
    var text = await (await fh.getFile()).text();
    await root.removeEntry("__lt_diag.txt");
    if(text !== "привет") throw new Error("прочитано «" + text + "»");
    return features;
  }

  async function probe(label, url, opts, note){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 12000);
    try{
      var o = opts || {};
      o.signal = ctl.signal;
      var res = await fetch(url, o);
      add(true, label, "HTTP " + res.status + " (ответ получен, CORS пропускает)" + (note ? ". " + note : ""));
    }catch(e){
      add(false, label, "ошибка: " + fmtErr(e) + " (CORS или нет сети)" + (note ? ". " + note : ""));
    }finally{
      clearTimeout(timer);
    }
  }

  async function runAll(){
    lines = [];
    add(null, "Адрес страницы", location.origin + " (secure context: " + window.isSecureContext + ")");
    add(null, "WebView", navigator.userAgent);
    try{
      if(window.LifeTrackerNative){ add(true, "Мост LifeTrackerNative", LifeTrackerNative.getAppInfo()); }
      else add(false, "Мост LifeTrackerNative", "объекта нет");
    }catch(e){ add(false, "Мост LifeTrackerNative", fmtErr(e)); }

    add(null, "Экран", "innerWidth=" + innerWidth + ", innerHeight=" + innerHeight + ", dpr=" + devicePixelRatio +
      (window.visualViewport ? ", visualViewport=" + Math.round(visualViewport.width) + "x" + Math.round(visualViewport.height) : ""));
    try{
      var probeEl = document.createElement("div");
      probeEl.style.cssText = "position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
      document.body.appendChild(probeEl);
      var cs = getComputedStyle(probeEl);
      add(null, "env(safe-area-inset) top/right/bottom/left", [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(" / "));
      probeEl.remove();
    }catch(e){}

    add(!!(window.crypto && crypto.subtle), "crypto.subtle (шифрование заметок и файлов)");
    try{ localStorage.setItem("__lt_diag", "1"); var v = localStorage.getItem("__lt_diag"); localStorage.removeItem("__lt_diag"); add(v === "1", "localStorage"); }
    catch(e){ add(false, "localStorage", fmtErr(e)); }
    try{ var ir = await idbRounds(1); add(ir.ok, "IndexedDB (запись, чтение, удаление)", ir.ok ? "" : "\n   " + ir.detail); }
    catch(e){ add(false, "IndexedDB", fmtErr(e)); }
    try{ add(true, "OPFS (navigator.storage.getDirectory)", await opfsTest()); }
    catch(e){ add(false, "OPFS (navigator.storage.getDirectory)", fmtErr(e)); }
    try{
      var c = await caches.open("__lt_diag");
      await c.put("/__lt_diag", new Response("ok"));
      var m = await c.match("/__lt_diag");
      var ok = !!m && (await m.text()) === "ok";
      await caches.delete("__lt_diag");
      add(ok, "Cache API");
    }catch(e){ add(false, "Cache API", fmtErr(e)); }
    try{
      var est = await navigator.storage.estimate();
      var pers = navigator.storage.persisted ? await navigator.storage.persisted() : "нет API";
      add(null, "Хранилище", "квота ≈ " + Math.round(est.quota / 1048576) + " МБ, занято ≈ " + Math.round(est.usage / 1048576) + " МБ, persisted=" + pers);
    }catch(e){ add(null, "Хранилище", fmtErr(e)); }
    add(null, "Service worker в WebView", ("serviceWorker" in navigator) ? "API есть (приложение его в оболочке не регистрирует)" : "API нет");

    try{
      var res = await fetch("/vendor/sql-wasm.wasm");
      var ct = res.headers.get("content-type");
      var buf = await res.arrayBuffer();
      var mod = await WebAssembly.compile(buf);
      add(res.ok && ct === "application/wasm", "sql-wasm.wasm из бандла", "HTTP " + res.status + ", " + ct + ", " + Math.round(buf.byteLength / 1024) + " КБ, компиляция ок, instantiateStreaming=" + (typeof WebAssembly.instantiateStreaming));
    }catch(e){ add(false, "sql-wasm.wasm из бандла", fmtErr(e)); }
    try{
      var v2 = await (await fetch("/version.json", {cache: "no-store"})).json();
      add(!!v2.version, "version.json бандла", JSON.stringify(v2));
    }catch(e){ add(false, "version.json бандла", fmtErr(e)); }

    updState();

    await probe("Firebase: GET (облачная синхронизация)", FIREBASE + "/syncs/__lt_diag_probe.json?shallow=true", {},
      "200 или 401/403 — нормально: главное, что ответ дошёл");
    await probe("Firebase: PATCH с JSON (проверка preflight)", FIREBASE + "/syncs/__lt_diag_probe.json", {
      method: "PATCH", headers: {"Content-Type": "application/json"}, body: "{}"
    }, "тело {} ничего не создаёт");
    await probe("YouTube oEmbed (заголовки видео)", "https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=dQw4w9WgXcQ"));
    await probe("corsproxy.io (прокси для flibusta)", "https://corsproxy.io/?url=" + encodeURIComponent("https://example.com/"),
      {}, "если здесь ошибка, а flibusta в приложении работает, это нормально");
    await probe("docs.google.com (s89 и workbooks)", "https://docs.google.com/document/d/1/export?format=txt", {},
      "только справка: реальные ссылки проверяются в самой функции");
    add(null, "Готово", new Date().toLocaleString());
  }

  async function camTest(){
    try{
      var stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
      var tracks = stream.getVideoTracks();
      var label = tracks.length ? tracks[0].label : "?";
      tracks.forEach(function(t){ t.stop(); });
      add(true, "Камера (getUserMedia)", label);
    }catch(e){ add(false, "Камера (getUserMedia)", fmtErr(e)); }
  }

  function updState(){
    try{
      if(!window.LifeTrackerNative || !LifeTrackerNative.getWebUpdateState){
        add(false, "Обновление веба", "в этой оболочке нет моста обновления (нужен APK шага 3)");
        return null;
      }
      var s = JSON.parse(LifeTrackerNative.getWebUpdateState());
      add(null, "Обновление веба", "встроенная " + s.builtin + ", раздаётся " + s.served + ", активная " + (s.active || "—") +
        ", запасная " + (s.lastGood || "—") + ", ждёт запуска " + (s.pending || "—") + ", пробная " + (s.trial || "—") +
        ", неудачные [" + (s.bad || []).join(", ") + "]. Последняя проверка: " + s.lastResult);
      return s;
    }catch(e){ add(false, "Обновление веба", fmtErr(e)); return null; }
  }

  function updCheck(){
    if(!window.LifeTrackerNative || !LifeTrackerNative.checkWebUpdateNow){ updState(); return; }
    LifeTrackerNative.checkWebUpdateNow();
    add(null, "Проверка обновления", "запущена, жду ответ GitHub");
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      var s = null;
      try{ s = JSON.parse(LifeTrackerNative.getWebUpdateState()); }catch(e){}
      if((s && !s.busy && tries > 1) || tries > 90){
        clearInterval(timer);
        updState();
      }
    }, 1000);
  }

  function updSelfTest(){
    try{
      var text = LifeTrackerNative.runWebUpdateSelfTest();
      text.split("\n").forEach(function(l){ if(l) lines.push(l); });
      show();
    }catch(e){ add(false, "Самотест обновления", fmtErr(e)); }
  }

  // ===== Шаг 4: нативные замены =====
  var S4_METHODS = ["beginSave", "appendSave", "finishSave", "cancelSave", "showToast", "beginStage", "finishStage",
    "shareStaged", "shareText", "clearStaged", "setFullscreen", "takeSharedFiles", "releaseSharedFile", "setStatusBarColor"];

  function s4Bridge(){
    var N = window.LifeTrackerNative;
    if(!N){ add(false, "Мост шага 4", "нет LifeTrackerNative"); return; }
    var info = {};
    try{ info = JSON.parse(N.getAppInfo()); }catch(e){}
    add(info.bridgeVersion >= 2, "Версия моста", String(info.bridgeVersion || "нет (APK старше шага 4)") + ", APK " + (info.versionName || "?"));
    var missing = S4_METHODS.filter(function(m){ return typeof N[m] === "undefined"; });
    add(missing.length === 0, "Методы моста шага 4", missing.length ? "нет: " + missing.join(", ") : "все " + S4_METHODS.length + " на месте");
    add(!!window.LifeTrackerShell, "native-shell.js загружен", window.LifeTrackerShell ? "да, сохранение: " + window.LifeTrackerShell.canSave() + ", поделиться: " + window.LifeTrackerShell.canShare() : "нет");
    add(typeof navigator.share === "function", "navigator.share определён", String(typeof navigator.share));
  }

  // Файл 5 МБ (два куска по 3 МБ): байты i % 251, чтобы размер и содержимое можно было сверить глазами по размеру файла.
  function s4Save(){
    s4Bridge();
    var size = 5 * 1024 * 1024;
    var bytes = new Uint8Array(size);
    for(var i = 0; i < size; i++) bytes[i] = i % 251;
    var blob = new Blob([bytes], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "lt-diag-test.bin";
    document.body.appendChild(a);
    var t0 = Date.now();
    document.addEventListener("lt-native-saved", function onSaved(ev){
      document.removeEventListener("lt-native-saved", onSaved);
      var d = ev.detail || {};
      add(d.bytes === size, "Сохранение через a.click()", "имя «" + d.name + "», " + d.bytes + " из " + size + " байт, " + (Date.now() - t0) + " мс. Проверьте файл в «Загрузках»: размер 5 242 880 байт");
    });
    a.click(); // подменённый click: файл уходит в оболочку, на экране появится сообщение «Сохранено в «Загрузки»»
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
    add(null, "Сохранение запущено", "жду ответ оболочки");
  }

  function s4Share(){
    var file;
    try{ file = new File(["Проверка «Поделиться» из Life tracker\n"], "lt-diag-share.txt", { type: "text/plain" }); }
    catch(e){ add(false, "Создание файла", fmtErr(e)); return; }
    var can = typeof navigator.canShare === "function" ? navigator.canShare({ files: [file] }) : "нет canShare";
    add(can === true, "canShare с файлом", String(can));
    if(typeof navigator.share !== "function"){ add(false, "Поделиться", "navigator.share нет"); return; }
    navigator.share({ files: [file], title: "Проверка" }).then(function(){
      add(true, "Поделиться", "системное меню открыто (выберите приложение и проверьте, что файл дошёл)");
    }, function(e){ add(false, "Поделиться", fmtErr(e)); });
  }

  function s4Full(){
    var N = window.LifeTrackerNative;
    if(!N || typeof N.setFullscreen === "undefined"){ add(false, "Полный экран", "нет setFullscreen (APK старше шага 4)"); return; }
    N.setFullscreen(true);
    add(null, "Полный экран", "включён на 5 секунд: строка состояния и системные кнопки должны исчезнуть, провести от края экрана — показать на время");
    setTimeout(function(){ N.setFullscreen(false); add(null, "Полный экран", "выключен: панели должны вернуться"); }, 5000);
  }

  document.getElementById("s4bridge").onclick = function(){ s4Bridge(); };
  document.getElementById("s4save").onclick = function(){ s4Save(); };
  document.getElementById("s4share").onclick = function(){ s4Share(); };
  document.getElementById("s4full").onclick = function(){ s4Full(); };

  // ---------------------------------------------------------------- Шаг 5: уведомления при закрытом приложении
  function s5Bridge(){
    var L = window.LTNotify;
    if(!L || !L.available){ add(false, "Шаг 5: мост", "нет методов уведомлений (APK старше шага 5)"); return null; }
    return L;
  }
  function fmtTs(ms){ return ms ? new Date(ms).toLocaleString("ru-RU") : "—"; }

  function s5State(){
    var L = s5Bridge(); if(!L) return;
    var st = L.state();
    if(!st){ add(false, "Шаг 5: состояние", "оболочка не ответила"); return; }
    add(st.permission, "Уведомления разрешены", st.permission ? "да" : (st.canRequest ? "нет — нажмите «Шаг 5: разрешение»" : "нет — включите в настройках уведомлений приложения"));
    add(st.exactAlarm, "Точные будильники", st.exactAlarm ? "разрешены" : "запрещены (напоминания придут неточно)");
    add(st.batteryIgnored ? true : null, "Оптимизация батареи", st.batteryIgnored ? "приложение исключено" : "ограничение включено — см. «Шаг 5: работа в фоне»");
    add(null, "Напоминаний в оболочке", st.reminders + ", ближайшее: " + fmtTs(st.nextAt));
    add(null, "Слежение за общими задачами", st.watching ? "включено (настройки группы получены от приложения)" : "выключено (нет группы или приложение ещё не прислало настройки)");
    add(null, "Журнал проверок группы", (st.pollLog && st.pollLog.length) ? "\n   " + st.pollLog.join("\n   ") : "пока пуст");
    add(null, "Устройство", st.manufacturer + ", Android SDK " + st.sdk);
  }
  function s5Perm(){
    var L = s5Bridge(); if(!L) return;
    L.onPermission(function(granted){ add(granted, "Разрешение на уведомления", granted ? "выдано" : "не выдано"); });
    var st = L.state();
    if(st && st.permission){ add(true, "Разрешение на уведомления", "уже выдано"); return; }
    if(st && !st.canRequest){ add(null, "Разрешение на уведомления", "системный запрос недоступен — открываю настройки уведомлений"); L.openNotifySettings(); return; }
    L.requestPermission();
  }
  function s5Test(){
    var L = s5Bridge(); if(!L) return;
    var st = L.state();
    if(st && !st.permission){ add(false, "Тест напоминания", "сначала выдайте разрешение («Шаг 5: разрешение»)"); return; }
    if(!L.scheduleTestReminder(60)){ add(false, "Тест напоминания", "не удалось поставить"); return; }
    add(null, "Тест напоминания", "поставлено на 1 минуту. ВАЖНО: сразу закройте приложение (кнопка «Домой» или смахните из списка) или заблокируйте экран. Пока приложение на экране, уведомление не показывается — напоминание остаётся за самим приложением. Через минуту должно прийти уведомление «Пробное напоминание» с кнопками «✓ Готово» и «Завтра».");
  }
  function s5Poll(){
    var L = s5Bridge(); if(!L) return;
    if(!L.runGroupPollNow()){ add(false, "Проверка группы", "не удалось запустить"); return; }
    add(null, "Проверка группы", "запущена, результат через 5 секунд…");
    setTimeout(function(){
      var st = L.state();
      add(null, "Журнал проверок группы", (st && st.pollLog && st.pollLog.length) ? "\n   " + st.pollLog.join("\n   ") : "пока пуст");
    }, 5000);
  }
  function s5Bg(){
    var L = s5Bridge(); if(!L) return;
    add(null, "Работа в фоне", "открываю настройки. Xiaomi/HyperOS: включите «Автозапуск» для Life tracker, затем в «Приложения → Life tracker → Контроль активности» выберите «Нет ограничений». Остальные телефоны: разрешите работу без ограничений батареи.");
    L.openBackgroundSettings();
  }
  document.getElementById("s5state").onclick = function(){ s5State(); };
  document.getElementById("s5perm").onclick = function(){ s5Perm(); };
  document.getElementById("s5test").onclick = function(){ s5Test(); };
  document.getElementById("s5poll").onclick = function(){ s5Poll(); };
  document.getElementById("s5bg").onclick = function(){ s5Bg(); };

  // ---------------------------------------------------------------- Шаг 6: проверки переноса данных
  // Читают данные приложения (тот же origin), ничего в них не пишут. Значения не показываются: только имена, размеры, хеши.
  function fmtMB(n){ return n >= 1048576 ? (n/1048576).toFixed(1) + " МБ" : n >= 1024 ? (n/1024).toFixed(1) + " КБ" : n + " Б"; }
  async function sha(bytes){ var d = await crypto.subtle.digest("SHA-256", bytes); return Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join(""); }
  async function shaStr(s){ return (await sha(new TextEncoder().encode(s))).slice(0, 12); }
  function pickFiles(accept, multiple){
    return new Promise(function(resolve){
      var inp = document.createElement("input"); inp.type = "file"; if(accept) inp.accept = accept; inp.multiple = !!multiple;
      inp.style.display = "none"; document.body.appendChild(inp);
      var done = false;
      function fin(l){ if(done) return; done = true; inp.remove(); resolve(l); }
      inp.addEventListener("change", function(){ fin(Array.from(inp.files || [])); });
      inp.addEventListener("cancel", function(){ fin([]); });
      inp.click();
    });
  }
  // Выбор двух файлов: если системный выбор не даёт отметить два сразу, файлы можно выбрать по одному,

    function scan(t){ if(!t) return; IMG_REF_RE.lastIndex = 0; var m; while((m = IMG_REF_RE.exec(t))){ refs[m[1].trim().toLowerCase()] = 1; } }
    a.ents.forEach(function(e){ if(e.path.indexOf("notes/") === 0){ try{ scan(dec.decode(e.data)); }catch(x){} } });
    var rd = a.data && a.data.rawState && a.data.rawState.data || {};
    Object.keys(rd).forEach(function(k){ if((k.indexOf("task:") === 0 || k.indexOf("comment:") === 0) && rd[k] && rd[k].c && rd[k].c.text) scan(rd[k].c.text); });
    var keys = Object.keys(imgs), orphans = keys.filter(function(k){ return !refs[k]; }), missing = Object.keys(refs).filter(function(k){ return !imgs[k]; });
    var bytes = 0; keys.forEach(function(k){ bytes += imgs[k].size; });
    return { imgs: imgs, refs: refs, keys: keys, orphans: orphans, missing: missing, bytes: bytes };
  }
  async function s6Archive(two){
    var files = two ? await pickTwo("arc", ".zip,.json") : await pickFiles(".zip,.json", true);
    if(!files) return;
    if(!files.length){ add(null, "Шаг 6: архив", "файл не выбран"); return; }
    try{
      var R = await loadRegistry(), arcs = [];
      for(var f = 0; f < files.length; f++){
        var a = await readArchive(files[f]); arcs.push(a);
        add(true, "Файл выбран и прочитан: " + a.name, fmtMB(a.size) + ", чтение " + a.readMs + " мс, распаковка " + a.zipMs + " мс, записей " + a.ents.length);
        add(null, "Состав", Object.keys(a.groups).map(function(g){ return g + " " + a.groups[g].n + " (" + fmtMB(a.groups[g].b) + ")"; }).join("; "));
        if(!a.data){ add(false, "data.json", a.dataErr || "нет в архиве"); continue; }
        var d = a.data, ds = d.deviceSettings, ni = d.notesIndex;
        add(d.exportFormatVersion <= 3, "data.json", "версия формата " + d.exportFormatVersion + ", создан " + d.exportedAt + ", разделов " + Object.keys(d).length);
        var rs = d.rawState && d.rawState.data ? Object.keys(d.rawState.data).length : 0; add(rs > 0, "rawState.data", rs + " записей");
        a.img = imgReport(a);
        add(null, "Картинки в архиве", a.img.keys.length + " файлов (" + fmtMB(a.img.bytes) + "); с ссылками из заметок/задач: " + (a.img.keys.length - a.img.orphans.length) + "; без ссылок («сироты», приложение удалит их при запуске): " + a.img.orphans.length + (a.img.orphans.length ? "\n   сироты: " + a.img.orphans.slice(0, 12).map(function(k){ return a.img.imgs[k].name; }).join(", ") + (a.img.orphans.length > 12 ? " …" : "") : ""));
        if(a.img.missing.length) add(null, "Ссылки на картинки, которых нет в архиве", a.img.missing.length + ": " + a.img.missing.slice(0, 12).join(", "));
        var mdN = (a.groups["notes/"] || {}).n || 0;
        if(!ni) add(mdN ? false : null, "notesIndex", "нет (старый архив)" + (mdN ? ", заметок в архиве " + mdN + ": после импорта потеряется привязка заметок книг" : ""));
        else { var ids = ni.map(function(r){ return r.id; }), bad = ids.filter(function(i){ return !/^[A-Za-z0-9_-]{1,64}$/.test(String(i)); }).length, uniq = new Set(ids).size === ids.length;
          add(bad === 0 && uniq && ni.length === mdN, "notesIndex", ni.length + " записей, заметок-файлов " + mdN + ", небезопасных id " + bad + ", повторов " + (uniq ? "нет" : "есть")); }
        if(!ds) add(false, "deviceSettings", "нет (код синхронизации и настройки не перенесутся)");
        else { var lsK = Object.keys(ds.localStorage || {}), notInc = lsK.filter(function(k){ return !hasK(R.localStorage.include, k); });
          add(notInc.length === 0, "deviceSettings.localStorage", lsK.length + " ключей, импорт проигнорирует: " + (notInc.length ? notInc.join(", ") : "ничего") + "; formatVersion " + ds.formatVersion);
          { var hasCode = !!(ds.localStorage && ds.localStorage.bibleReadingSyncId_v1);
            add(hasCode ? true : null, "Код синхронизации в архиве", hasCode ? "есть (значение не показывается)" : "нет: в приложении код не вводился или он не попал в архив; значение не показывается"); }
          add(null, "jwlMergeState_v1 / taskRemindersFired_v1", ((ds.localStorage || {}).jwlMergeState_v1 || "").length + " / " + ((ds.localStorage || {}).taskRemindersFired_v1 || "").length + " символов");
          add(null, "mdEditorDB в архиве", Object.keys((ds.indexedDB || {}).mdEditorDB || {}).join(", ") || "пусто"); }
      }
      if(arcs.length === 2 && arcs[0].data && arcs[1].data){
        var A = arcs[0], B = arcs[1], paths = {}, onlyA = [], onlyB = [], diff = [];
        A.ents.concat(B.ents).forEach(function(e){ paths[e.path] = 1; });
        for(var p in paths){ var ea = A.by[p], eb = B.by[p];
          if(!ea) onlyB.push(p); else if(!eb) onlyA.push(p);
          else if(p !== "data.json" && p !== "README.txt" && (ea.data.length !== eb.data.length || (await sha(ea.data)) !== (await sha(eb.data)))) diff.push(p); }
        add(!onlyA.length && !onlyB.length && !diff.length, "Круг «экспорт → импорт → экспорт»: файлы", (onlyA.length ? "только в первом: " + onlyA.slice(0, 8).join(", ") + "; " : "") + (onlyB.length ? "только во втором: " + onlyB.slice(0, 8).join(", ") + "; " : "") + (diff.length ? "отличаются: " + diff.slice(0, 8).join(", ") : (!onlyA.length && !onlyB.length ? "все файлы одинаковы" : "")));
        var da = Object.assign({}, A.data), db2 = Object.assign({}, B.data); delete da.exportedAt; delete db2.exportedAt;
        var tk = {}; Object.keys(da).concat(Object.keys(db2)).forEach(function(k){ tk[k] = 1; });
        var dk = Object.keys(tk).filter(function(k){ return canon(da[k]) !== canon(db2[k]); });
        if(A.img && B.img){
          var iA = A.img.keys.filter(function(k){ return !B.img.imgs[k]; }), iB = B.img.keys.filter(function(k){ return !A.img.imgs[k]; });
          var iD = A.img.keys.filter(function(k){ return B.img.imgs[k] && A.img.imgs[k].size !== B.img.imgs[k].size; });
          var lst = function(arr, X){ return arr.slice(0, 15).map(function(k){ return X.img.imgs[k].name + (X.img.refs[k] ? " [есть ссылка]" : " [сирота]"); }).join(", ") + (arr.length > 15 ? " …" : ""); };
          add(!iA.length && !iB.length && !iD.length, "Картинки: первый архив " + A.img.keys.length + ", второй " + B.img.keys.length,
            (iA.length ? "\n   есть только в первом (" + iA.length + ", из них сирот " + iA.filter(function(k){ return !A.img.refs[k]; }).length + "): " + lst(iA, A) : "") +
            (iB.length ? "\n   есть только во втором (" + iB.length + "): " + lst(iB, B) : "") +
            (iD.length ? "\n   разный размер у " + iD.length + ": " + iD.slice(0, 10).map(function(k){ return A.img.imgs[k].name; }).join(", ") : "") +
            (!iA.length && !iB.length && !iD.length ? "наборы совпадают" : ""));
          if(iA.length){ var allOrph = iA.every(function(k){ return !A.img.refs[k]; });
            add(allOrph ? null : false, "Картинки: чего не хватает во втором архиве", allOrph ? "все пропавшие были сиротами: это чистка при запуске, а не потеря при переносе" : "среди пропавших есть картинки со ссылками: это настоящая потеря, пришлите этот результат"); }
        }
        add(dk.length === 0, "data.json: разделы", dk.length ? "отличаются: " + dk.join(", ") : "одинаковы (кроме времени экспорта)");
        if(dk.indexOf("rawState") >= 0){ var xa = A.data.rawState.data, xb = B.data.rawState.data, ch = Object.keys(xa).filter(function(k){ return k in xb && canon(xa[k]) !== canon(xb[k]); }), ms = Object.keys(xa).filter(function(k){ return !(k in xb); }), ex = Object.keys(xb).filter(function(k){ return !(k in xa); });
          add(null, "rawState.data", "изменились " + ch.length + ", пропали " + ms.length + ", добавились " + ex.length + "; примеры: " + ch.concat(ms, ex).slice(0, 10).join(", ")); }
      }else if(arcs.length === 2) add(false, "Сравнение", "один из архивов без data.json");
    }catch(e){ add(false, "Проверка архива", fmtErr(e)); }
  }

  async function s6Pick(){
    var files = await pickFiles(".zip,.json,.md", false);
    if(!files.length){ add(null, "Шаг 6: выбор файла", "ничего не выбрано"); return; }
    var f = files[0];
    try{
      var head = new Uint8Array(await f.slice(0, 8).arrayBuffer()), hex = Array.from(head).map(function(b){ return b.toString(16).padStart(2, "0"); }).join(" ");
      add(true, "Файл выбран: " + f.name, fmtMB(f.size) + ", тип «" + (f.type || "—") + "», первые байты " + hex);
      if(f.size === 5242880){ var u = new Uint8Array(await f.arrayBuffer()), good = true; for(var i = 0; i < u.length; i++){ if(u[i] !== i % 251){ good = false; break; } }
        add(good, "Круг «сохранить → выбрать»", good ? "5 МБ из «Шаг 4: сохранить файл» вернулись без изменений" : "содержимое не совпало на байте " + i); }
    }catch(e){ add(false, "Выбор файла", fmtErr(e)); }
  }

  var s6BigBusy = false;
  async function s6Big(mb){
    if(s6BigBusy){ add(null, "Шаг 6: объём " + mb + " МБ", "пропущено: предыдущая проверка объёма ещё идёт, дождитесь её результата"); return; }
    s6BigBusy = true;
    try{ await s6BigRun(mb); } finally { s6BigBusy = false; }
  }
  async function s6BigRun(mb){
    add(null, "Шаг 6: объём " + mb + " МБ", "выделяю память. Если страница перезагрузится или приложение закроется, это и есть результат: запишите, на каком размере.");
    var CH = 16, chunks = [], t0 = Date.now();
    try{ for(var done = 0; done < mb; done += CH){ var u = new Uint8Array(Math.min(CH, mb - done) * 1048576); u.fill((done + 7) & 255); u[0] = done & 255; chunks.push(u); } }
    catch(e){ add(false, "Память " + mb + " МБ", fmtErr(e) + ", выделено " + chunks.length * CH + " МБ"); return; }
    var blob = new Blob(chunks, { type: "application/octet-stream" }); chunks = null;
    add(null, "Данные в памяти", (Date.now() - t0) + " мс, Blob " + fmtMB(blob.size));
    var stem = "lt-diag-big-" + mb + "mb";
    var r = await saveBlob(stem + ".bin", blob, 600000, function(d){ return d.bytes === blob.size && (!d.name || String(d.name).indexOf(stem) === 0); });
    add(r.ok && r.detail.bytes === blob.size, "Сохранение " + mb + " МБ в «Загрузки»", r.ok ? r.detail.bytes + " байт за " + r.ms + " мс. Удалите файл lt-diag-big-" + mb + "mb.bin из «Загрузок»" : "ответа нет за " + Math.round(r.ms / 1000) + " с");
  }

  document.getElementById("s6idb").onclick = function(){ s6Idb(); };

  document.getElementById("s6arc2").onclick = function(){ s6Archive(true); };
  document.getElementById("s6pick").onclick = function(){ s6Pick(); };
  document.getElementById("s6b100").onclick = function(){ s6Big(100); };
  document.getElementById("s6b300").onclick = function(){ s6Big(300); };
  document.getElementById("s6b600").onclick = function(){ s6Big(600); };

  document.getElementById("run").onclick = function(){ runAll(); };
  document.getElementById("upd").onclick = function(){ updState(); };
  document.getElementById("updcheck").onclick = function(){ updCheck(); };
  document.getElementById("updtest").onclick = function(){ updSelfTest(); };
  document.getElementById("cam").onclick = function(){ camTest(); };
  document.getElementById("copy").onclick = function(){
    var text = lines.join("\n");
    try{ navigator.clipboard.writeText(text).then(function(){ add(null, "Скопировано в буфер"); }, function(e){ add(false, "Копирование", fmtErr(e)); }); }
    catch(e){ add(false, "Копирование", fmtErr(e)); }
  };
})();
